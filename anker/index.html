<!DOCTYPE html>
<html lang="de">

<title>Verankerung in Beton – DIN EN 1992-4</title>

<body>
<p>Werkzeug in Arbeit: Oberfläche folgt. Rechenkern siehe Quelltext (<code>script id="kern"</code>), Tests in <code>tests/anker.test.mjs</code>.</p>

<script id="kern">
"use strict";
/* =====================================================================================================
   Rechenkern Verankerung in Beton – DIN EN 1992-4:2019-04 mit DIN EN 1992-4/NA:2019-04
   Version 1: Widerstände je Versagensart aus ETA bzw. Herstellersoftware (Eingabe), Nachweise nach
   Tab. 7.1, 7.2 und 7.3. Reine Funktionen ohne DOM; im Browser global ANKER, in Node über tests/anker.test.mjs.
   Einheiten: Kräfte kN, Längen mm, Momente kNm (Eingabe), intern kN·mm. M⁰Rk,s in Nm (= kN·mm).
   NA: Für statische und quasi-statische Bemessung gelten die Empfehlungen der Norm (NDP zu 4.4.2.2 (2)).
   ===================================================================================================== */
const ANKER = (() => {
const VERSION = "1.0", STAND = "14.11.2026";
const EPS = 1e-9;

// Ungeprüfte Annahmen: im Code mit PRÜFEN markiert, in der Oberfläche als „ungeprüft“ angezeigt
const PRUEFEN = {
  druck: "Gedrückte Anker: Druckresultierende an der äußeren gedrückten Ankerreihe, Gleichgewicht neu gelöst. Vereinfachter Ansatz auf der sicheren Seite statt Druckzone nach 6.2.1 (1) und Bild 6.2.", // PRÜFEN
  druck2d: "Gedrückte Anker bei zweiachsiger Biegung: Druckpunkt im Schwerpunkt der äußersten gedrückten Anker (Ecke).", // PRÜFEN
  e1HB: "Hebelarm aus der Zwischenschicht: e₁ = H_B + t_fix/2 (Querlast in Mitte Winkelschenkel angesetzt; Bild 6.6 nicht ausgewertet).", // PRÜFEN
  kanteNah: "Kantenbruch, randnahe Anker: senkrechter Lastanteil der ganzen Gruppe auf die randnahen Anker, paralleler Anteil je Anker (Auslegung von 6.2.2.2 Anm. 2 und Bild 6.5).", // PRÜFEN
  bild12: "Anordnung randnaher Gruppen mit Lochspiel: Abdeckung durch Bild 1.2 b) nicht geprüft (Bild nicht ausgewertet).", // PRÜFEN
};

// Normbezüge für die Randspalte
const REF = {
  geltung: "DIN EN 1992-4, 1.2 (4), 1.3 (1)–(3)",
  zug: "DIN EN 1992-4, 6.2.1 (1)",
  druck: "DIN EN 1992-4, 6.2.1 (1) d); Ansatz s. Hinweise",
  exz: "DIN EN 1992-4, 6.2.1 (3) [als f) gedruckt], Bild 6.3",
  quer: "DIN EN 1992-4, 6.2.2.2 (1) a), Bild 6.4",
  lochspiel: "DIN EN 1992-4, 6.2.2.1, Tab. 6.1",
  hebel: "DIN EN 1992-4, 6.2.2.3, Gl. (6.1), (6.2)",
  gamma: "DIN EN 1992-4, Tab. 4.1; NA: NDP zu 4.4.2.2 (2)",
  Ns: "DIN EN 1992-4, Tab. 7.1 Z. 1; 7.2.1.3",
  Np: "DIN EN 1992-4, Tab. 7.1 Z. 3; 7.2.1.5",
  Npv: "DIN EN 1992-4, Tab. 7.1 Z. 4; 7.2.1.6",
  Nc: "DIN EN 1992-4, Tab. 7.1 Z. 2; 7.2.1.4",
  Nsp: "DIN EN 1992-4, Tab. 7.1 Z. 5; 7.2.1.7",
  Vs: "DIN EN 1992-4, Tab. 7.2 Z. 1; 7.2.2.3.1",
  VsM: "DIN EN 1992-4, Tab. 7.2 Z. 2; 7.2.2.3.2, Gl. (7.37), (7.38)",
  Vcp: "DIN EN 1992-4, Tab. 7.2 Z. 3; 7.2.2.4",
  Vc: "DIN EN 1992-4, Tab. 7.2 Z. 4; 7.2.2.5",
  intS: "DIN EN 1992-4, 7.2.3.1, Tab. 7.3 Z. 1, Gl. (7.54)",
  intC: "DIN EN 1992-4, 7.2.3.1, Tab. 7.3 Z. 2, Gl. (7.55)",
  intC12: "DIN EN 1992-4, 7.2.3.1, Tab. 7.3 Z. 2, Gl. (7.56)",
};

const NAME = {
  Ns: "Stahlbruch (Zug)", Np: "Herausziehen", Npv: "Herausziehen und Betonbruch (Verbunddübel)",
  Nc: "Kegelförmiger Betonausbruch", Nsp: "Spalten", Vs: "Stahlbruch ohne Hebelarm", VsM: "Stahlbruch mit Hebelarm",
  Vcp: "Betonausbruch auf der lastabgewandten Seite", Vc: "Betonkantenbruch",
};

// Betonfestigkeitsklassen (fck in N/mm²); fck wird in V1 nur angezeigt. Für V2: fck ≤ 60 nach 7.1 (2).
const BETON = { "C12/15": 12, "C16/20": 16, "C20/25": 20, "C25/30": 25, "C30/37": 30, "C35/45": 35, "C40/50": 40,
  "C45/55": 45, "C50/60": 50, "C55/67": 55, "C60/75": 60, "C70/85": 70, "C80/95": 80, "C90/105": 90 };

// Tab. 6.1 – Durchmesser d bzw. dnom → größter Durchmesser df des Durchgangslochs [mm]; über 30 mm: d + 3
const TAB61 = { 6: 7, 8: 9, 10: 12, 12: 14, 14: 16, 16: 18, 18: 20, 20: 22, 22: 24, 24: 26, 27: 30, 30: 33 };
function dfMax(d) {
  if (d > 30) return d + 3;
  return Object.prototype.hasOwnProperty.call(TAB61, d) ? TAB61[d] : null;  // Zwischenwerte nennt die Tabelle nicht
}

// Teilsicherheitsbeiwerte nach Tab. 4.1, ständige und vorübergehende Bemessungssituation
function gammaMsN(fuk, fyk) { return fuk <= 800 && fyk / fuk <= 0.8 ? Math.max(1.2 * fuk / fyk, 1.4) : 1.5; }
function gammaMsV(fuk, fyk) { return fuk <= 800 && fyk / fuk <= 0.8 ? Math.max(1.0 * fuk / fyk, 1.25) : 1.5; }
function gammaMc(gInst) { return 1.5 * gInst; }   // γc = 1,5; γMsp = γMp = γMc

// Hebelarm la = a3 + e1 (Gl. 6.2); a3 = 0,5·dnom, = 0 bei Scheibe+Mutter direkt gegen Beton bzw. Mörtel ≤ d/2
function hebelarm(dnom, e1, a3Null) { const a3 = a3Null ? 0 : 0.5 * dnom; return { a3, e1, la: a3 + e1 }; }
// e1 aus der Zwischenschicht des Rothoblaas-Winkels – PRÜFEN (PRUEFEN.e1HB)
function e1AusZwischenschicht(HB, tfix) { return HB + tfix / 2; }

const num = x => typeof x === "number" && isFinite(x);
const hyp = Math.hypot;

// ------------------------------------------------------------------ lineare Algebra 2×2 (symmetrisch)
// Löst [a11 a12; a12 a22]·x = r. Bei Rang 1 Lösung mit kleinster Norm, sofern r im Bildraum liegt; sonst null.
function loese2(a11, a12, a22, r1, r2) {
  const det = a11 * a22 - a12 * a12, sk = Math.max(Math.abs(a11), Math.abs(a22));
  const rtol = 1e-6 * Math.max(hyp(r1, r2), 1);
  if (sk > 0 && Math.abs(det) > 1e-10 * sk * sk) return [(r1 * a22 - r2 * a12) / det, (a11 * r2 - a12 * r1) / det];
  const tr = a11 + a22;
  if (tr <= 1e-12) return hyp(r1, r2) <= rtol ? [0, 0] : null;
  let ex = Math.sqrt(Math.max(a11, 0) / tr), ey = Math.sqrt(Math.max(a22, 0) / tr);
  if (a12 < 0) ey = -ey;
  const p = r1 * ex + r2 * ey;
  if (hyp(r1 - p * ex, r2 - p * ey) > rtol) return null;
  return [p / tr * ex, p / tr * ey];
}

// ------------------------------------------------------------------ Lastaufteilung, starres Anbauteil
// Koordinaten bezogen auf den Schwerpunkt der Gruppe. Vorzeichen: N Zug positiv; My erzeugt Zug auf der +x-Seite
// (My = Σ Ni·xi), Mx Zug auf der +y-Seite (Mx = Σ Ni·yi); T gegen den Uhrzeigersinn positiv.
function schwerpunkt(pk) { const n = pk.length; return { x: pk.reduce((a, p) => a + p.x, 0) / n, y: pk.reduce((a, p) => a + p.y, 0) / n }; }

function zugElastisch(d, N, My, Mx) {
  const n = d.length;
  let sxx = 0, sxy = 0, syy = 0;
  d.forEach(p => { sxx += p.x * p.x; sxy += p.x * p.y; syy += p.y * p.y; });
  const ab = loese2(sxx, sxy, syy, My, Mx);
  if (!ab) return null;
  return { a: ab[0], b: ab[1], N: d.map(p => N / n + ab[0] * p.x + ab[1] * p.y) };
}

// Neuverteilung bei gedrückten Ankern – PRÜFEN (PRUEFEN.druck): Druckresultierende C im Schwerpunkt P der
// äußeren gedrückten Ankerreihe (Ankern mit kleinstem Wert der elastischen Kraftverteilung, Toleranz 1 mm).
// Starre Platte dreht um P: Ni = b·ui + c·vi ≥ 0 (u, v ab P); Gleichgewicht ΣNi − C = N, Σ Ni·ui = My − N·xP, Σ Ni·vi = Mx − N·yP.
function zugNeuverteilt(d, N, My, Mx, el) {
  const n = d.length, g = hyp(el.a, el.b);
  if (g < 1e-12) return { N: d.map(() => 0), C: Math.max(-N, 0), P: { x: 0, y: 0 }, reihe: d.map((_, i) => i), zweiachsig: false };
  const proj = d.map(p => el.a * p.x + el.b * p.y), pmin = Math.min(...proj);
  const reihe = []; proj.forEach((v, i) => { if (v - pmin <= 1.0 * g) reihe.push(i); });
  const P = { x: reihe.reduce((s, i) => s + d[i].x, 0) / reihe.length, y: reihe.reduce((s, i) => s + d[i].y, 0) / reihe.length };
  const u = d.map(p => p.x - P.x), v = d.map(p => p.y - P.y);
  const r1 = My - N * P.x, r2 = Mx - N * P.y;
  let aktiv = d.map((_, i) => el.N[i] > EPS && !reihe.includes(i)), bc = [0, 0];
  for (let it = 0; it < 50; it++) {
    let suu = 0, suv = 0, svv = 0;
    aktiv.forEach((a, i) => { if (a) { suu += u[i] * u[i]; suv += u[i] * v[i]; svv += v[i] * v[i]; } });
    const l = loese2(suu, suv, svv, r1, r2);
    if (!l) return null;
    bc = l;
    const w = d.map((_, i) => bc[0] * u[i] + bc[1] * v[i]);
    const neu = w.map(x => x > 1e-9);
    if (neu.every((x, i) => x === aktiv[i])) break;
    aktiv = neu;
  }
  const Ni = d.map((_, i) => aktiv[i] ? Math.max(bc[0] * u[i] + bc[1] * v[i], 0) : 0);
  const C = Ni.reduce((s, x) => s + x, 0) - N;
  // Gleichgewicht prüfen
  const m1 = Ni.reduce((s, x, i) => s + x * u[i], 0) - r1, m2 = Ni.reduce((s, x, i) => s + x * v[i], 0) - r2;
  if (C < -1e-6 || hyp(m1, m2) > 1e-6 * Math.max(hyp(r1, r2), 1)) return null;
  const zweiachsig = Math.abs(el.a) > 1e-6 * g && Math.abs(el.b) > 1e-6 * g;
  return { N: Ni, C, P, reihe, zweiachsig };
}

// Aufteilung eines Lastfalls bei starrer Platte (direkte Eingabe der Schnittgrößen am Gruppenschwerpunkt)
// opt.druck: "ablehnen" (Vorgabe) | "neuverteilen"
function aufteilen(anker, lf, opt) {
  opt = opt || {};
  const fehler = [], hinweise = [], ungeprueft = [];
  const n = anker.length, S = schwerpunkt(anker), d = anker.map(p => ({ x: p.x - S.x, y: p.y - S.y }));
  const N = lf.N || 0, My = (lf.My || 0) * 1000, Mx = (lf.Mx || 0) * 1000, T = (lf.T || 0) * 1000, Vx = lf.Vx || 0, Vy = lf.Vy || 0;
  let druck = null, Ni;
  const el = zugElastisch(d, N, My, Mx);
  if (!el) { fehler.push("Biegemoment um die Ankerachse kann von den Ankern allein nicht aufgenommen werden (Anker liegen in einer Linie bzw. Einzelanker)."); return { fehler, hinweise, ungeprueft }; }
  const minN = Math.min(...el.N);
  if (minN >= -EPS) Ni = el.N.map(x => Math.max(x, 0));
  else if (Math.max(...el.N) <= EPS) { Ni = el.N.map(() => 0); hinweise.push("Alle Anker rechnerisch gedrückt: keine Zugkräfte; Druck über das Anbauteil in den Beton."); }
  else if (opt.druck === "neuverteilen") {
    const r = zugNeuverteilt(d, N, My, Mx, el);
    if (!r) { fehler.push("Neuverteilung bei gedrückten Ankern ohne Gleichgewichtslösung."); return { fehler, hinweise, ungeprueft }; }
    Ni = r.N; druck = { C: r.C, P: { x: r.P.x + S.x, y: r.P.y + S.y }, reihe: r.reihe.map(i => i + 1), elastisch: el.N.slice() };
    ungeprueft.push("druck"); if (r.zweiachsig) ungeprueft.push("druck2d");
  } else {
    const ids = el.N.map((x, i) => x < -EPS ? `${i + 1} (N = ${x.toFixed(2)} kN)` : null).filter(Boolean).join(", ");
    fehler.push(`Anker ${ids} rechnerisch gedrückt. Druck unter dem Anbauteil ist noch nicht freigegeben; Fall abgelehnt.`);
    return { fehler, hinweise, ungeprueft, elastisch: el.N };
  }
  // Querlast: gleichmäßig + Torsion (Bild 6.4)
  const sr2 = d.reduce((s, p) => s + p.x * p.x + p.y * p.y, 0);
  if (Math.abs(T) > EPS && sr2 < 1e-9) { fehler.push("Torsionsmoment an einem Einzelanker nicht aufnehmbar."); return { fehler, hinweise, ungeprueft }; }
  const V = d.map(p => sr2 > 0 ? [Vx / n - T * p.y / sr2, Vy / n + T * p.x / sr2] : [Vx / n, Vy / n]);
  return { fehler, hinweise, ungeprueft, N: Ni, V, druck, weg: "starr", torsion: Math.abs(T) > EPS };
}

// Gruppengrößen aus den Ankerkräften (beide Wege): N^h, N^g, eN (6.2.1 (3)), V^h, V^g, eV
function gruppe(anker, Ni, Vi) {
  const S = schwerpunkt(anker);
  const zug = Ni.map((x, i) => x > EPS ? i : -1).filter(i => i >= 0);
  const Ng = zug.reduce((s, i) => s + Ni[i], 0), Nh = Math.max(0, ...Ni);
  let eN = { x: 0, y: 0 }, SZ = null;
  if (zug.length) {
    SZ = { x: zug.reduce((s, i) => s + anker[i].x, 0) / zug.length, y: zug.reduce((s, i) => s + anker[i].y, 0) / zug.length };
    const R = { x: zug.reduce((s, i) => s + Ni[i] * anker[i].x, 0) / Ng, y: zug.reduce((s, i) => s + Ni[i] * anker[i].y, 0) / Ng };
    eN = { x: R.x - SZ.x, y: R.y - SZ.y };
  }
  const Vsum = Vi.reduce((s, v) => [s[0] + v[0], s[1] + v[1]], [0, 0]);
  const Vg = hyp(Vsum[0], Vsum[1]), Vh = Math.max(0, ...Vi.map(v => hyp(v[0], v[1])));
  const T = Vi.reduce((s, v, i) => s + (anker[i].x - S.x) * v[1] - (anker[i].y - S.y) * v[0], 0);
  let gegen = false;
  for (let i = 0; i < Vi.length; i++) for (let j = i + 1; j < Vi.length; j++) if (Vi[i][0] * Vi[j][0] + Vi[i][1] * Vi[j][1] < -EPS) gegen = true;
  const gleich = Vi.every(v => hyp(v[0] - Vi[0][0], v[1] - Vi[0][1]) <= 1e-6 * Math.max(Vh, 1));
  return { Nh, Ng, eN, SZ, Vh, Vg, Vsum, T, eV: Vg > EPS ? T / Vg : 0, gegen, gleich, S };
}

// ------------------------------------------------------------------ Widerstände
// w: {art:"k", Rk, gM} | {art:"d", Rd} | {art:"entfaellt", grund}; quelle optional
function bemessungswert(key, w, fehler) {
  if (!w || !w.art) return { fehlt: true };
  const nm = NAME[key] || key;
  if (w.art === "entfaellt") {
    if (key === "Ns" || key === "Vs" || key === "VsM") { fehler.push(`${nm}: Stahlversagen kann nicht entfallen.`); return { fehlt: true }; }
    if (!String(w.grund || "").trim()) { fehler.push(`${nm}: „entfällt“ nur mit Begründung.`); return { fehlt: true }; }
    return { entfaellt: true, grund: String(w.grund).trim() };
  }
  if (w.art === "k") {
    if (!num(w.Rk) || w.Rk <= 0) { fehler.push(`${nm}: charakteristischer Widerstand fehlt oder ≤ 0.`); return { fehlt: true }; }
    if (!num(w.gM) || w.gM < 1) { fehler.push(`${nm}: Teilsicherheitsbeiwert γM fehlt oder < 1,0.`); return { fehlt: true }; }
    return { art: "k", Rk: w.Rk, gM: w.gM, Rd: w.Rk / w.gM, quelle: w.quelle || "" };
  }
  if (w.art === "d") {
    if (!num(w.Rd) || w.Rd <= 0) { fehler.push(`${nm}: Bemessungswert fehlt oder ≤ 0.`); return { fehlt: true }; }
    return { art: "d", Rd: w.Rd, quelle: w.quelle || "" };
  }
  fehler.push(`${nm}: unbekannte Eingabeart.`); return { fehlt: true };
}
// Ausnutzung; fehlender Widerstand bei vorhandener Einwirkung → Fehler
function quote(E, R, key, fehler) {
  if (E <= EPS) return 0;
  if (R.entfaellt) return 0;
  if (R.fehlt) { fehler.push(`${NAME[key] || key}: Widerstand fehlt, Einwirkung ${E.toFixed(2)} kN.`); return NaN; }
  return E / R.Rd;
}

// Geometrieschlüssel: gehören die eingegebenen Betonwiderstände noch zur Geometrie?
function geoSchluessel(e) {
  const g = e.geo || {}, r = x => Math.round(x * 10) / 10;
  return JSON.stringify({ a: (e.anker || []).map(p => [r(p.x), r(p.y)]), r: (g.raender || []).map(x => [x.richtung, r(x.c)]).sort(),
    h: r(g.h), hef: r(g.hef), b: g.beton, z: g.zustand });
}

const RICHTUNG = { "+x": [1, 0], "-x": [-1, 0], "+y": [0, 1], "-y": [0, -1] };

// ------------------------------------------------------------------ Gesamtnachweis
/* e = {
     anker: [{x, y}],                        Lage [mm]
     modus: "starr" | "jeAnker",             starre Platte (Schnittgrößen) oder Kräfte je Anker (Übergabe)
     druck: "ablehnen" | "neuverteilen",
     interaktion: "7.55" | "7.56",
     geo: { h, hef, d, dnom, beton, zustand, typ: "mechanisch"|"verbund", fuk, betonschraube,
            raender: [{richtung: "+x"|"-x"|"+y"|"-y", c}], lochspiel: "ohne"|"tab61", df },
     mindest: { smin, cmin, hmin },
     lastfaelle: [{ name, N, Vx, Vy, Mx, My, T }]  bzw. [{ name, je: [{N, Vx, Vy}] }],
     widerstand: { Ns, Np, Nc, Nsp, Vs, Vcp, Vc: [je Rand] },
     hebel: { mit: bool, M0Rks [Nm], alphaM, gMs, e1, a3Null },
     geoSchluessel
   } */
function nachweis(e) {
  const fehler = [], warn = [], hinweise = [], ung = new Set();
  const out = { version: VERSION, fehler, warn, hinweise, ungeprueft: [], mindest: [], lf: [], etaMax: null, ok: null };
  const fertig = () => { out.ungeprueft = [...ung].map(k => ({ key: k, text: PRUEFEN[k] })); return out; };
  const A = e.anker || [], g = e.geo || {}, W = e.widerstand || {}, H = e.hebel || {};
  const n = A.length;
  // Eingaben und Geltungsbereich
  if (n < 1) { fehler.push("Keine Anker eingegeben."); return fertig(); }
  if (n > 12) fehler.push("Mehr als 12 Anker sind im Werkzeug nicht vorgesehen.");
  if (A.some(p => !num(p.x) || !num(p.y))) { fehler.push("Ankerkoordinaten unvollständig."); return fertig(); }
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) if (hyp(A[i].x - A[j].x, A[i].y - A[j].y) < 1) fehler.push(`Anker ${i + 1} und ${j + 1} liegen aufeinander.`);
  for (const [k, t] of [["h", "Bauteildicke h"], ["hef", "Verankerungstiefe hef"], ["d", "Durchmesser d"]]) if (!num(g[k]) || g[k] <= 0) fehler.push(`${t} fehlt.`);
  const dnom = num(g.dnom) && g.dnom > 0 ? g.dnom : g.d;
  if (!Object.prototype.hasOwnProperty.call(BETON, g.beton)) fehler.push("Betonfestigkeitsklasse fehlt oder unbekannt.");
  if (g.zustand !== "gerissen" && g.zustand !== "ungerissen") fehler.push("Betonzustand (gerissen/ungerissen) fehlt.");
  if (g.typ !== "mechanisch" && g.typ !== "verbund") fehler.push("Dübelart (mechanisch / Verbunddübel) fehlt.");
  if (fehler.length) return fertig();
  if (g.hef >= g.h) fehler.push(`h_ef = ${g.hef} mm ≥ h = ${g.h} mm.`);
  if (g.d < 6) fehler.push(`d = ${g.d} mm < 6 mm (M6): außerhalb des Anwendungsbereichs, 1.3 (1).`);
  if (g.d > 60 && (e.lastfaelle || []).some(l => (l.Vx || l.Vy || (l.je || []).some(a => a.Vx || a.Vy)))) fehler.push(`d = ${g.d} mm > 60 mm bei Querlast: außerhalb des Anwendungsbereichs, 1.3 (1).`);
  if (g.hef < 40) fehler.push(`h_ef = ${g.hef} mm < 40 mm: außerhalb des Anwendungsbereichs für tragende Befestigungen, 1.3 (2).`);
  if (g.typ === "verbund" && g.hef > 20 * g.d) fehler.push(`Verbunddübel mit h_ef = ${g.hef} mm > 20·d = ${20 * g.d} mm: nicht abgedeckt, 1.3 (2).`);
  if (num(g.fuk) && g.fuk > 1000 && !g.betonschraube) fehler.push(`f_uk = ${g.fuk} N/mm² > 1000 N/mm²: nicht abgedeckt, 1.3 (3).`);
  const R = g.raender || [];
  R.forEach((r, i) => { if (!RICHTUNG[r.richtung] || !num(r.c) || r.c <= 0) fehler.push(`Rand ${i + 1}: Richtung oder Randabstand fehlt.`); });
